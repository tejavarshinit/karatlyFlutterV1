name: karatly
description: "Karatly — Buy Digital Gold & Silver"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # UI
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Charts
  fl_chart: ^0.69.2

  # Utils
  intl: ^0.19.0
  image: ^4.5.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  device_info_plus: ^11.3.0
  package_info_plus: ^8.1.3

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.4

  # WebView (for payment gateway)
  webview_flutter: ^4.10.0

  # Video Player (for diamond product videos)
  video_player: ^2.8.7

  # Web support (for diamond 360° viewer iframe) - web only via conditional import
  web: ^1.1.1

  # Image picker (for KYC documents)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/certificate/
    - assets/animations/
    - assets/fonts/
