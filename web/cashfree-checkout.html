<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashfree Checkout</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: radial-gradient(103.89% 37.92% at 97.55% 0%, #293341 0%, #0A0F1A 100%);
      color: #fff;
    }
    .card {
      width: min(420px, 100%);
      border: 1px solid #2E2E2E;
      border-radius: 20px;
      background: rgba(26, 35, 50, 0.98);
      padding: 20px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    .title { font-size: 18px; font-weight: 700; }
    .sub { margin-top: 8px; font-size: 13px; color: #B8C0CA; line-height: 1.5; }
    .amount { margin-top: 14px; font-size: 22px; font-weight: 700; color: #F7CD57; }
    .hint { margin-top: 8px; font-size: 12px; color: #7E7E7E; word-break: break-all; }
    .btn {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(90deg, #FED45C, #DB9502);
      color: #111;
      font-weight: 700;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Opening Cashfree checkout</div>
    <div class="sub" id="status">This page will continue to Cashfree using the fresh payment session id.</div>
    <div class="amount" id="amount">Proceeding to payment...</div>
    <div class="hint" id="sessionHint">Waiting for payment session...</div>
    <button class="btn" id="retryBtn" type="button" style="display:none;">Retry</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const paymentSessionId = params.get('paymentSessionId') || '';
    const amount = params.get('amount') || '';
    const status = document.getElementById('status');
    const amountEl = document.getElementById('amount');
    const sessionHint = document.getElementById('sessionHint');
    const retryBtn = document.getElementById('retryBtn');

    if (amount) {
      amountEl.textContent = '₹' + amount;
    }
    if (paymentSessionId) {
      sessionHint.textContent = paymentSessionId;
    }

    const cashfree = Cashfree({ mode: 'production' });

    async function openCheckout() {
      if (!paymentSessionId) {
        status.textContent = 'Missing paymentSessionId in the URL.';
        retryBtn.style.display = 'block';
        return;
      }

      try {
        await cashfree.checkout({
          paymentSessionId,
          redirectTarget: '_self',
        });
      } catch (error) {
        status.textContent = 'Unable to open checkout automatically.';
        retryBtn.style.display = 'block';
      }
    }

    retryBtn.addEventListener('click', openCheckout);
    openCheckout();
  </script>
</body>
</html>
